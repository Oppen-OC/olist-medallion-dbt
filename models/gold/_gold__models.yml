version: 2

models:
  - name: gold_monthly_sales
    description: "Gold: revenue and order volume aggregated by calendar month, canceled orders excluded"
    columns:
      - name: order_month
        data_tests:
          - unique
          - not_null

  - name: gold_category_performance
    description: "Gold: revenue and item volume aggregated by product category (English name)"
    columns:
      - name: product_category
        data_tests:
          - unique
          - not_null

  - name: gold_seller_performance
    description: "Gold: revenue, order volume and average review score aggregated by seller"
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
